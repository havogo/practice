<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<title>Practice</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Prescriptions, patient notes and billing for a single-practitioner practice.">

<!-- Home Screen install -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Practice">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#f2f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1014" media="(prefers-color-scheme: dark)">

<link rel="stylesheet" href="styles/app.css">
<link rel="modulepreload" href="app/main.js">
</head>
<body>

<div id="app">
  <main class="view" style="display:grid;place-items:center;min-height:60dvh">
    <div class="spinner"></div>
  </main>
</div>

<!-- The printable prescription/invoice is rendered here, outside the app shell,
     so the print stylesheet can hide the interface entirely. -->
<div id="print-root" class="script" aria-hidden="true"></div>

<div id="toasts" role="status" aria-live="polite"></div>

<script type="module" src="app/main.js"></script>
<noscript>
  <p style="padding:24px;font-family:system-ui">This app needs JavaScript enabled.</p>
</noscript>
</body>
</html>
